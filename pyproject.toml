[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freight_rate"
version = "0.1.0"
description = "Spotter Freight Rate ML Engineering Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.3,<2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
